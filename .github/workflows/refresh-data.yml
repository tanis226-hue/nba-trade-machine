name: refresh-data

# Calendar-driven cadence (NOT 24/7). Daily baseline, escalating to every 6h during the two
# high-activity windows — February (trade deadline) and late June/July (draft + free agency).
# Manual dispatch covers same-day breaking moves (e.g. a Shams report) between scheduled runs.
on:
  workflow_dispatch:
    inputs:
      database:
        description: Database to refresh (production requires main)
        type: choice
        required: true
        default: isolated
        options:
          - isolated
          - production
  schedule:
    - cron: '0 9 * * *'            # daily 09:00 UTC — quiet-season baseline
    - cron: '0 */6 1-29 2 *'       # every 6h in February — trade deadline window
    - cron: '0 */6 20-30 6 *'      # every 6h late June — NBA draft window
    - cron: '0 */6 1-15 7 *'       # every 6h early July — free-agency moratorium/open

concurrency:
  group: refresh-data-${{ github.event_name == 'workflow_dispatch' && inputs.database == 'isolated' && 'isolated' || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      REFRESH_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.database == 'isolated' && 'isolated' || 'production' }}
      # An absent isolated secret must NEVER fall back to the production connection.
      # Production credentials are only selected on main, including scheduled runs.
      DATABASE_URL: ${{ (github.event_name == 'workflow_dispatch' && inputs.database == 'isolated' && secrets.NBA_LAUNCH_DATABASE_URL) || (github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.database == 'production') && (secrets.DATABASE_URL || secrets.NETLIFY_DATABASE_URL)) || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check database configuration
        shell: bash
        run: |
          if [ "$REFRESH_TARGET" = "production" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production refreshes must run from main."
            exit 1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure the database secret for the selected $REFRESH_TARGET target before refreshing."
            exit 1
          fi
          echo "Refreshing the $REFRESH_TARGET database."

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install scraper deps
        run: pip install -r scripts/scraper/requirements.txt

      - name: Read current roster biographies
        run: python scripts/rosters/pull.py

      - name: Read current team cap sheets (throttled)
        run: python scripts/rosters/pull_capsheets.py

      - name: Install app deps
        run: npm ci

      - name: Build the versioned public snapshot
        run: npm run rosters:build

      - name: Verify merged data before database writes
        run: npm run data:check

      - name: Keep the audited public snapshot for release verification
        uses: actions/upload-artifact@v4
        with:
          name: nba-snapshot-${{ github.run_id }}
          path: data/seed/roster_snapshot_2026_27.json
          retention-days: 7

      - name: Apply migrations (idempotent)
        run: npx tsx scripts/migrate.ts

      - name: Atomically publish the validated roster snapshot
        run: npm run rosters:publish

      # Contract flags not published by the cap-sheet source remain curated inputs.
      # A fetch/build/audit failure stops before publication and retains the prior snapshot.
